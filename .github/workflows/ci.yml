# Every PR and every push to main: the flake's checks (Rust tests of the sensor and beat-probe, the WASM tools,
# pytest of the client) and the sensor's image. The Rust dependencies take ~20 min to build cold, so the Nix store is
# cached between runs (cache-nix-action, on GitHub's cache).
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', '**/Cargo.lock', 'uv.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
      - run: nix flake check -L
      - run: nix build .#beat-sensor-image -L && cat result/beat-sensor.roothash
