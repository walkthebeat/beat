# Every PR and every push to main: the flake's checks (Rust tests of the sensor and beat-probe, the WASM tools,
# pytest of the client) and the sensor's image. The Rust dependencies take ~20 min to build cold, so the Nix store is
# cached between runs (cache-nix-action, on GitHub's cache): ~20 min cold, minutes warm.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Single-user Nix: the store belongs to the runner, so the cache below can unpack into it (with the daemon's
      # root-owned store every restore failed, and each run built from scratch).
      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-store-${{ runner.os }}-${{ hashFiles('flake.lock', '**/Cargo.lock', 'uv.lock') }}
          restore-prefixes-first-match: nix-store-${{ runner.os }}-
          gc-max-store-size-linux: 8G
      - run: nix flake check -L
      - run: nix build .#beat-sensor-image -L && cat result/beat-sensor.roothash
