# A tag v<release> (pyproject.toml `version`, which flake.nix reads as `release`: one version for the client and the
# sensor) publishes the sensor's image and installer as a GitHub release, then the client on PyPI. The image is meant to be reproducible
# (anyone builds `.#beat-sensor-image` at the tag and compares beat-sensor.roothash); not yet: docs/reproducibility.md.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write      # the release
  id-token: write      # build attestations (public repos only, below)
  attestations: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # Single-user Nix: the store belongs to the runner, so the cache below can unpack into it (with the daemon's
      # root-owned store every restore failed, and each run built from scratch).
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c  # v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569  # v7
        with:
          primary-key: nix-store-${{ runner.os }}-${{ hashFiles('flake.lock', '**/Cargo.lock', 'uv.lock') }}
          restore-prefixes-first-match: nix-store-${{ runner.os }}-
          gc-max-store-size-linux: 8G
      - run: nix flake check -L
      - name: build the image
        run: |
          nix build .#beat-sensor-image -L
          release="$(nix eval --raw .#beat-sensor.version)"
          case "$release" in "${GITHUB_REF_NAME#v}+g"*) ;; *) echo "tag $GITHUB_REF_NAME, flake $release" >&2; exit 1 ;; esac
          mkdir dist && cp -L result/* dist/
          echo "RELEASE=$release" >> "$GITHUB_ENV"
      - name: attest the files
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: dist/*
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          beat-sensor $RELEASE. Install on a host (x86_64, systemd 247 or later):

              curl -fsSL https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/install.sh | sudo sh

          The image's root hash: \`$(cat dist/beat-sensor.roothash)\`. Not yet reproducible bit for bit: a rebuild
          at this tag can differ in a few eBPF tools' type order (docs/reproducibility.md).
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* --title "beat-sensor $RELEASE" --notes-file notes.md
  # The client's wheel, built with no write access to anything; the upload below only takes the file.
  pypi-build:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - run: pipx run build --wheel
      - name: the wheel is this tag's version
        run: test -f "dist/walkthebeat-${GITHUB_REF_NAME#v}-py3-none-any.whl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: wheel
          path: dist/
  # PyPI trusts this workflow in this environment (trusted publishing: no stored token). The environment `pypi` waits
  # for a reviewer's approval and takes tags v* only. A version can never be uploaded twice.
  pypi-publish:
    needs: pypi-build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: wheel
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
