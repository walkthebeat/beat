[package]
name = "beat-sensor"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "beat's sensor: answers questions published on NATS by running them with beat-probe (docs/protocol.md)"

[dependencies]
anyhow = "1"
async-nats = "0.42"
base64 = "0.22"
bytes = "1"
ed25519-dalek = "2"
futures = "0.3"
hpke = { version = "0.12", default-features = false, features = ["x25519", "alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"         # without preserve_order: objects serialize with sorted keys (canonical answers, wire.rs)
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }  # enroll.rs: the service's HTTP API
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[profile.release]
opt-level = 2
