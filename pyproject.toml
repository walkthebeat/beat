[project]
name = "walkthebeat"  # on PyPI (beat there is another project); the commands are beat and beat-mcp, the module beat
version = "0.1.0"  # the release: the client and the sensor (flake.nix reads it); tag v<version>
description = "beat's client: the CLI, the MCP server, the signer and the wire protocol"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "cryptography>=48",   # HPKE and Ed25519 (seal.py)
    # From 49.0 cryptography has macOS wheels for arm64 only; 48.0.1 is the last with one for Intel Macs (universal2).
    # Without the cap there, `uv tool install` builds it from source and fails without Rust and OpenSSL. Here, not in
    # [tool.uv]: installs from git or PyPI read only [project].
    "cryptography<=48.0.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "mcp<2",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
beat = "beat.cli:main"
beat-mcp = "beat.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beat"]

[tool.hatch.build.targets.wheel.force-include]  # `beat report` masks transcripts with the sensor's rules
"probe/rules/betterleaks.json" = "beat/rules/betterleaks.json"
"probe/rules/beat.json" = "beat/rules/beat.json"
"probe/rules/LICENSE.betterleaks" = "beat/rules/LICENSE.betterleaks"

[tool.pytest.ini_options]
testpaths = ["tests"]
