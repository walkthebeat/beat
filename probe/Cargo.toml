[package]
name = "beat-probe"
version = "0.1.0"
edition = "2021"
description = "Starlark probes with beat builtins: checks before sending, evaluation on the host (docs/probes.md)."

[dependencies]
anyhow = "1"
base64 = "0.22"
cap-std = "4"           # file access that cannot leave a mapped directory (the same crate WASI uses)
glob = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
starlark = "=0.14.2"     # 0.14.0 resolves mismatched starlark_syntax/pagable versions and does not build
starlark_syntax = "=0.14.2"   # AST visitor (not re-exported by starlark)
x509-parser = "0.17"    # certificate() (docs/security.md): pure Rust, no OpenSSL
wasmtime = { version = "49", default-features = false, features = ["anyhow", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "49", default-features = false, features = ["p1", "p2"] }

[profile.release]
opt-level = 2
